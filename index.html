      if (paginaAberta) {
        bodyContent += `</div>\n`;
      }

      // === SCRIPT GLOBAL DE NAVEGAÇÃO DE PÁGINAS ===
bodyContent += `
<script>
    function irParaPagina(idPagina) {
        // Esconde todas as páginas
        let paginas = document.querySelectorAll('.ryden-page');
        paginas.forEach(p => p.style.display = 'none');
        
        // Mostra a página alvo
        let paginaAlvo = document.getElementById(idPagina);
        if (paginaAlvo) {
            paginaAlvo.style.display = 'block';
        }
        
        // RESETA OS PLAYERS DA PÁGINA ATUAL
        setTimeout(() => {
            let paginaAtual = document.getElementById(idPagina);

                let players = paginaAtual.querySelectorAll('.ryden-fisica-player');
                players.forEach(p => {
                    // Reseta posição

                    p.dataset.y = yOriginal;
                    p.dataset.vx = '0';
                    p.dataset.vy = '0';
                    p.style.left = xOriginal + 'px';

                    p.style.display = 'block';
                });

        }, 50);

<\/script>
`;
      

      // === MOTOR P2P REAL COM PEERJS ===
      bodyContent += `
      <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"><\/script>
      <script>
        let peer = new Peer();
        let connAtiva = null;
        let historicoEl = document.getElementById('ryden-p2p-historico');

        peer.on('open', (id) => {
          let elId = document.getElementById('ryden-p2p-meu-id');
          if (elId) elId.innerText = id;
          if (historicoEl) historicoEl.innerHTML += '<br><span style="color: #00bcd4;">[P2P] Pronto! Seu ID foi gerado com sucesso.</span>';
        });

        // Quando alguém se conecta a você
        peer.on('connection', (c) => {
          connAtiva = c;
          configurarConexao();
          if (historicoEl) historicoEl.innerHTML += '<br><span style="color: #4caf50;">[P2P] Um usuario se conectou a você!</span>';
        });

        function conectarAmigo(idDestino) {
          if (connAtiva) connAtiva.close();
          connAtiva = peer.connect(idDestino);
          configurarConexao();
        }

        function configurarConexao() {
          if (!connAtiva) return;
          connAtiva.on('open', () => {
            if (historicoEl) historicoEl.innerHTML += '<br><span style="color: #4caf50;">[P2P] Conectado com sucesso ao peer!</span>';
          });
          connAtiva.on('data', (data) => {
            if (historicoEl) {
              historicoEl.innerHTML += \`<br><span style="color: #ff9800;">[usuario]:</span> \${data}\`;
              historicoEl.scrollTop = historicoEl.scrollHeight;
            }
          });
        }

        function enviarP2PReal() {
          let destino = document.getElementById('ryden-p2p-destino').value.trim();
          let texto = document.getElementById('ryden-p2p-texto').value.trim();

          if (!texto) return;

          // Se ainda não temos uma conexão ativa e o usuário digitou um ID, conecta agora
          if (!connAtiva && destino) {
            conectarAmigo(destino);
            setTimeout(() => mandarMsgDireta(texto), 1000); // Dá um tempinho para firmar a pipe
            return;
          }

          mandarMsgDireta(texto);
        }

        function mandarMsgDireta(texto) {
          if (connAtiva && connAtiva.open) {
            connAtiva.send(texto);
            if (historicoEl) {
              historicoEl.innerHTML += \`<br><span style="color: #00ff00;">[Você]:</span> \${texto}\`;
              historicoEl.scrollTop = historicoEl.scrollHeight;
            }
            document.getElementById('ryden-p2p-texto').value = '';
          } else {
            alert("Insira o ID do seu amigo no campo correspondente para conectar antes de enviar!");
          }
        }
      <\/script>
      `;

      // === FECHAMENTO/SAÍDA DO RS ===
      if (rsAtivo) {

      // === MONTA O HTML FINAL E ATUALIZA O PREVIEW ===
